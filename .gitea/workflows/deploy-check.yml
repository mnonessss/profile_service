name: Deploy Check

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Тег образа (latest или SHA коммита)"
        required: false
        default: latest

env:
  REGISTRY: git.klsh.ru
  IMAGE_NAME: team3/profile_service

jobs:
  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to container registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Pull image and start services
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          export IMAGE_TAG="${IMAGE_TAG:-latest}"
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d

      - name: Wait for application
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "Service is up"
              exit 0
            fi
            echo "Waiting for service... ($i/30)"
            sleep 2
          done
          echo "Service did not respond in time"
          docker compose -f docker-compose.prod.yml logs app --tail 50
          exit 1

      - name: Health check response
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -q "Profile Service API"
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:8000/metrics
