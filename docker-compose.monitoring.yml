version: '3.8'
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
    - "9090:9090" # веб-интерфейс Prometheus
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml # конфигурация Prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
    - monitoring
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
    - "3000:3000" # веб-интерфейс Grafana
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=admin # пароль администратора (логин admin)
    networks:
    - monitoring
networks:
  monitoring:
    driver: bridge